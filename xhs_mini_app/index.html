<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>分享解析小工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="app-logo">📕</div>
      <h1 class="app-title">分享解析小工具</h1>
      <p class="app-sub">小红书 · 网易云音乐 分享内容本地解析 · 自动识别平台</p>
    </header>

    <!-- 统一输入 -->
    <section class="panel">
      <div class="card">
        <h2 class="card-title">粘贴分享内容</h2>
        <textarea id="input" class="input" rows="6"
          placeholder="长按粘贴小红书或网易云音乐的分享文案（含链接）…&#10;&#10;自动识别平台：&#10;· 小红书：xhslink 短链 / xiaohongshu.com 长链（shareRedId / appuid）&#10;· 网易云：music.163.com 单曲 / 歌单 / 专辑 / 电台 / MV（userid / uct2 / uct）"></textarea>
        <div class="btn-row">
          <button type="button" id="parse-btn" class="btn btn-xhs">解析</button>
          <button type="button" id="clear-btn" class="btn btn-ghost">清空</button>
        </div>
        <div class="samples">
          <span class="sample-label">试试示例</span>
          <button type="button" class="chip" data-sample="xhs-short">📕 口令短链</button>
          <button type="button" class="chip" data-sample="xhs-sharered">📕 App分享</button>
          <button type="button" class="chip" data-sample="xhs-long">📕 网页长链</button>
          <button type="button" class="chip" data-sample="net-song-uct2">🎵 单曲(uct2)</button>
          <button type="button" class="chip" data-sample="net-playlist-uid">🎵 歌单(userid)</button>
        </div>
      </div>
      <div class="card result" id="result" hidden></div>
    </section>

    <!-- 分享卡片 -->
    <div class="card result" id="card-preview" hidden>
      <h2 class="card-title">分享卡片</h2>
      <div class="card-img-wrap"><img id="card-img" alt="分享卡片预览" /></div>
      <div class="btn-row">
        <button type="button" id="card-save" class="btn btn-xhs">保存到相册</button>
      </div>
      <div class="tip">保存到相册需在小红书容器内使用；其他环境可长按预览图手动保存</div>
    </div>

    <!-- 历史 -->
    <section class="card history-card" id="history-card" hidden>
      <h2 class="card-title">解析历史 <span class="history-count" id="history-count"></span></h2>
      <div id="history-list"></div>
      <button type="button" id="history-clear" class="btn btn-ghost btn-block">清空历史</button>
    </section>

    <footer class="app-footer">纯本地解析 · 不联网 · 历史记录仅存本机 · v1.2</footer>
  </div>

  <!-- crypto-js 组件（按依赖顺序加载，经典脚本） -->
  <script src="./assets/vendor/crypto-js/core.js"></script>
  <script src="./assets/vendor/crypto-js/x64-core.js"></script>
  <script src="./assets/vendor/crypto-js/cipher-core.js"></script>
  <script src="./assets/vendor/crypto-js/enc-base64.js"></script>
  <script src="./assets/vendor/crypto-js/enc-base64url.js"></script>
  <script src="./assets/vendor/crypto-js/md5.js"></script>
  <script src="./assets/vendor/crypto-js/aes.js"></script>
  <script src="./assets/vendor/crypto-js/mode-ecb.js"></script>
  <script src="./assets/vendor/crypto-js/pad-pkcs7.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
